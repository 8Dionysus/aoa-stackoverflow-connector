name: Validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check repo-local KAG index family
        # Provider: aoa-kag@v0.5.0, resolved at f46f146cc79a26fa81ad0f400b9c5774df293e57.
        # Action identity: repo-local-kag-index at f46f146cc79a26fa81ad0f400b9c5774df293e57.
        uses: 8Dionysus/aoa-kag/.github/actions/repo-local-kag-index@f46f146cc79a26fa81ad0f400b9c5774df293e57
        with:
          history-ref: ${{ github.event.pull_request.base.sha || github.event.before || format('{0}^', github.sha) }}
          event-history-ref: ${{ github.event.pull_request.base.sha || github.event.before || format('{0}^', github.sha) }}
      - uses: actions/checkout@v4
        with:
          repository: 8Dionysus/aoa-stats
          # Provider: aoa-stats@v0.2.0, resolved at 88ff38b1b38eef939f2c5b4541cbe8363a05fc8d.
          ref: 88ff38b1b38eef939f2c5b4541cbe8363a05fc8d
          path: .deps/aoa-stats
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pip install -r .deps/aoa-stats/requirements-dev.txt
      - run: python scripts/validate_local_stats_port.py
        env:
          AOA_STATS_ROOT: .deps/aoa-stats
      - run: python scripts/validate_connector.py
      - run: PYTHONPATH=src python -m pytest -q
