name: Validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check repo-local KAG index family
        # Provider: aoa-kag@v0.5.2, resolved at 8136d3eb629da28cea1206d13a8f1df52ee14739.
        # Action identity: repo-local-kag-index at 8136d3eb629da28cea1206d13a8f1df52ee14739.
        uses: 8Dionysus/aoa-kag/.github/actions/repo-local-kag-index@8136d3eb629da28cea1206d13a8f1df52ee14739
        with:
          history-ref: ${{ github.event.pull_request.base.sha || github.event.before || format('{0}^', github.sha) }}
          event-history-ref: ${{ github.event.pull_request.base.sha || github.event.before || format('{0}^', github.sha) }}
      - uses: actions/checkout@v4
        with:
          repository: 8Dionysus/aoa-stats
          # Provider: aoa-stats@v0.2.2, resolved at f119805cda69b3edeb2a4c5e407368d70e68650d.
          ref: f119805cda69b3edeb2a4c5e407368d70e68650d
          path: .deps/aoa-stats
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pip install -r .deps/aoa-stats/requirements-dev.txt
      - run: python scripts/validate_local_stats_port.py
        env:
          AOA_STATS_ROOT: .deps/aoa-stats
      - run: python scripts/validate_connector.py
      - run: PYTHONPATH=src python -m pytest -q
